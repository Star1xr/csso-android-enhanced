name: Android build
description: Build CS:SO libs for one ABI with ccache

inputs:
  script:
    description: Build script under scripts/
    required: true
  abi:
    description: Android ABI (cache and artifact name)
    required: true

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache

    - name: Restore toolchain cache
      id: toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          android-ndk-r10e
          clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04
        key: android-toolchain-v1

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.abi }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.abi }}-

    - name: Build
      shell: bash
      env:
        CCACHE_MAXSIZE: 2G
        CCACHE_COMPILERCHECK: string:llvm-11.1.0
      run: scripts/${{ inputs.script }}

    - name: Save toolchain cache
      if: always() && steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          android-ndk-r10e
          clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04
        key: android-toolchain-v1

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.abi }}-${{ github.sha }}

    - name: Upload libs
      uses: actions/upload-artifact@v7
      with:
        name: csso-libs-${{ inputs.abi }}
        path: Srceng-mod-launcher/android
        if-no-files-found: error
