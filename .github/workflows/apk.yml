name: Build APK

# Builds the engine libs (32 + 64 bit) and packs them into the CS:SO launcher (ndke01/csso-android-launcher, Gradle).
# Manual only.
on: workflow_dispatch

env:
  WAF_EXTRA: --use-ccache
  LAUNCHER_REPO: https://github.com/ndke01/csso-android-launcher

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build libs (32 bit)
      uses: ./.github/actions/android-build
      with:
        script: build-android-armv7a.sh
        abi: armeabi-v7a

    - name: Build libs (64 bit)
      uses: ./.github/actions/android-build
      with:
        script: build-android-aarch64.sh
        abi: arm64-v8a

    - name: Get the launcher
      run: git clone --depth 1 "$LAUNCHER_REPO" launcher

    - name: Put the libs into the launcher
      run: |
        for abi in armeabi-v7a arm64-v8a; do
          mkdir -p launcher/app/src/main/jniLibs/$abi
          # the launcher ships its own libSDL2.so; engine libs are added next to it
          find output/$abi -maxdepth 1 -name '*.so' ! -name 'libSDL2.so' -exec cp -v {} launcher/app/src/main/jniLibs/$abi/ \;
        done

    - name: Pack extras_dir.vpk
      working-directory: launcher/scripts
      run: bash build-vpk.sh

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Android platform 29
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;34.0.0"

    - name: Build release APK
      working-directory: launcher
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleRelease

    - name: Sign APK
      run: |
        APK=$(ls launcher/app/build/outputs/apk/release/*.apk | head -1)
        keytool -genkeypair -keystore csso.keystore -alias csso -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android -dname "CN=CSSO"
        "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$APK" aligned.apk
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks csso.keystore --ks-pass pass:android --key-pass pass:android \
          --out csso-release.apk aligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        path: csso-release.apk
        archive: false
