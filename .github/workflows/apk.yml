name: Build APK

# manual only
on: workflow_dispatch

jobs:
  Build-apk-for-android:
    runs-on: ubuntu-latest
    env:
      WAF_EXTRA: ${{ github.ref_name == 'rocketui-port' && '--rocketui' || '' }}

    steps:
    - uses: actions/checkout@v4
    - name: Cloning modlaucher repo and preparing for building
      run: |
        git clone https://github.com/DMK95/Srceng-mod-launcher/ -b csso
        sudo apt-get update
        # build-tools 21.0.0 (aapt, zipalign) are 32-bit binaries: "libz.so.1: cannot open shared object file" without these
        sudo apt-get install -f -y openjdk-8-jre zip apksigner lib32z1 lib32stdc++6
    - name: Build Android (32 bit)
      run: |
        scripts/build-android-armv7a.sh
    - name: Build Android (64 bit)
      run: |
        scripts/build-android-aarch64.sh    
    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'
    - name: Build APK
      run: |
        scripts/build-apk.sh 
    - name: Rename APK
      run: |
         mv Srceng-mod-launcher/build/android/mod-signed.apk csso-release.apk

    - name: 'Upload APK'
      uses: actions/upload-artifact@v7
      with:
        path: csso-release.apk
        archive: false