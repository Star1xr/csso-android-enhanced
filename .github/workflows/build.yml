name: Build

# push: 32-bit only. Manual run: pick 32-bit, 64-bit or both.
on:
  push:
  workflow_dispatch:
    inputs:
      arch:
        description: Which build to run
        type: choice
        options: [32-bit, 64-bit, both]
        default: 32-bit

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WAF_EXTRA: --use-ccache ${{ github.ref_name == 'rocketui-port' && '--rocketui' || '' }}

jobs:
  build-32:
    if: github.event_name == 'push' || inputs.arch != '64-bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build
        with:
          script: build-android-armv7a.sh
          abi: armeabi-v7a

  build-64:
    if: github.event_name == 'workflow_dispatch' && inputs.arch != '32-bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build
        with:
          script: build-android-aarch64.sh
          abi: arm64-v8a
